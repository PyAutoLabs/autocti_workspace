# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI). Same schema as the *_workspace_test
# repos — see autocti_workspace_test/config/build/profile_smoke.yaml.
#
# PYAUTO_TEST_MODE=2 bypasses sampling entirely, so a script's search returns a
# deterministic assertion-valid point instead of fitting. That is what makes the
# modeling/start_here.py-class scripts smokeable at all: they build ordered trap
# models whose identical priors tie at the prior medians, which used to make the
# bypass hard-fail until PyAutoFit#1520 (438f56fac).
defaults:
  PYAUTO_TEST_MODE: "2"
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"
  # Drop every figure before it is rasterised or saved, as the autolens /
  # autogalaxy smoke profiles do. The bypassed fit still exercises every plot
  # call (the data/model extraction, the zoom, the subplot layout) — only the
  # matplotlib draw + PNG write and the mask-edge overlay are skipped. Measured
  # locally on imaging_ci/modeling/start_here.py (PyAutoBrain /ci_speedup,
  # 2026-09-08): ~17s of image rasterisation + ~20-40s of per-figure mask-edge
  # derivation on the 2000x100 frame, across ~100 on-the-fly figures per run.
  PYAUTO_FAST_PLOTS: "1"
  # Skip the in-search fit visualization (pre-fit, per-update and combined
  # subplots), as the autolens / autogalaxy smoke profiles do. Explicit plot
  # calls in scripts are unaffected. This supersedes the 2026-09-08 choice to
  # keep exercising every in-search plot call in smoke: the release profile
  # keeps real visualization (PYAUTO_SKIP_VISUALIZATION: "0"), so the release
  # run still covers it. Measured locally (py3.12, PyAutoBrain /ci_speedup,
  # 2026-11-08), whole smoke leg 311s -> 211s with all 44 scripts passing;
  # plot/fpa/imaging_ci/fit.py 40.0s -> 9.7s, cosmic_rays 21.5s -> 13.3s,
  # chaining/pipelines/parallel 14.9s -> 5.6s.
  PYAUTO_SKIP_VISUALIZATION: "1"
  MPLBACKEND: "Agg"
  NUMBA_CACHE_DIR: "/tmp/numba_cache"
  MPLCONFIGDIR: "/tmp/matplotlib"
overrides: {}
